[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rust-toolchain.toml: the only toolchain CI builds and tests.
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/thecsapprentice/quill"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Workspace crates
quill-proto = { path = "crates/quill-proto" }
quill-mls-envelope = { path = "crates/quill-mls-envelope" }
quill-core = { path = "crates/quill-core" }
quill-server = { path = "crates/quill-server" }
quill-board-ui = { path = "crates/quill-board-ui" }

# Shared third-party dependencies
anyhow = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
ammonia = "4"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# Server-side rendering only: no web, desktop or fullstack features.
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = "=0.7.10"
directories = "6"
getrandom = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[profile.release]
overflow-checks = true
