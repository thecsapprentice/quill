[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rust-toolchain.toml: the only toolchain CI builds and tests.
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/thecsapprentice/quill"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Workspace crates
quill-proto = { path = "crates/quill-proto" }
quill-mls-envelope = { path = "crates/quill-mls-envelope" }
quill-core = { path = "crates/quill-core" }
quill-server = { path = "crates/quill-server" }
quill-board-ui = { path = "crates/quill-board-ui" }
quill-certs = { path = "crates/quill-certs" }
quill-ui = { path = "crates/quill-ui" }
quill-gui = { path = "crates/quill-gui", default-features = false }

# Shared third-party dependencies
anyhow = "1"
# Compresses backup plaintext (2m); pure Rust, so no C toolchain in client builds.
ruzstd = "0.9"
age = { version = "0.11", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", features = ["zeroize"] }
ammonia = "4"
axum = "0.8"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
# Server-side rendering only: no web, desktop or fullstack features.
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"] }
# Same majors as OpenMLS 0.9 uses, so 2c adds no duplicates.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
# "mls": minimal length encodings only, 30-bit lengths (RFC 9420).
tls_codec = { version = "0.5", features = ["derive", "std", "mls"] }
dioxus-ssr = "=0.7.10"
# The desktop GUI only (3b), used directly so the server's `dioxus` keeps
# its features.
dioxus-desktop = { version = "=0.7.10", default-features = false, features = ["tokio_runtime"] }
directories = "6"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hkdf = "0.13"
# MLS (quill-core only; banned from the server's tree).
openmls = "0.9.2"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
# Client local store (quill-core only).
redb = "4.4"
keyring-core = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
# Automated moderation (#43): the script engine and its `text` API.
aho-corasick = "1"
linkify = "0.11"
regex = "1"
# "sync": scripts run on blocking threads, and shared values are Arc-based.
# "internals": walking a script's syntax tree to find the common data it
# reads. That API isn't covered by semver, hence the exact version.
rhai = { version = "=1.27.0", features = ["sync", "serde", "internals"] }
strsim = "0.11"
unicode-script = "0.5"
unicode-security = "0.1"
unicode-segmentation = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# The OpenAPI file (2m): the server and quill-proto's `openapi` feature.
utoipa = { version = "6", default-features = false, features = ["macros", "uuid", "time"] }
utoipa-axum = "0.3"
zeroize = { version = "1", features = ["derive", "serde"] }

[profile.release]
overflow-checks = true
