# cargo-deny policy. Run with `cargo deny check`.
# Per-crate bans for the server live in scripts/check-server-deps.sh.

[graph]
all-features = true

[advisories]
# RustSec advisory database. Any unignored advisory fails CI; an ignore entry
# must say why the advisory is unreachable or acceptable.
version = 2
yanked = "deny"
ignore = [
  # zbus 5's helper crates, merged into zbus 6 and so marked unmaintained;
  # not a vulnerability. Pulled in only by the Linux keychain support in
  # quill-core (secret-service, which has no zbus 6 release yet). Remove
  # when secret-service moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; client-only, Linux keychain" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; client-only, Linux keychain" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; client-only, Linux keychain" },
  # Unmaintained proc-macro helper, used only at build time by hax-lib's
  # verification annotations in libcrux-sha3 (via hpke-rs, via OpenMLS's
  # RustCrypto provider). Client-only; no code from it runs. Remove when
  # libcrux drops it.
  { id = "RUSTSEC-2026-0173", reason = "build-time proc macro in libcrux-sha3's annotations; client-only" },
  # Unmaintained TOML parser, used only at build time by the age crate's
  # localisation proc macros (i18n-embed-fl, i18n-embed-impl) to read their
  # config; no code from it runs in the client. Client-only (backups, 2j).
  # Remove when i18n-config moves off it, or if our own age implementation
  # replaces the crate.
  { id = "RUSTSEC-2026-0374", reason = "build-time proc macro config parser in age's i18n; client-only" },
  # crypto-bigint 0.5: timing variability in operations meant to be
  # constant-time. Used only by the NIST curves (p256, p384, k256) that
  # OpenMLS's RustCrypto provider and hpke-rs carry for other ciphersuites.
  # Quill uses only MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519 (X25519 and
  # Ed25519 through the dalek crates, which don't use crypto-bigint), and
  # its KeyPackages advertise no other suite, so no peer can choose one.
  # Client-only. The fix (0.7.6) needs elliptic-curve 0.14, which
  # openmls_rust_crypto 0.6 doesn't use yet; remove when it does.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint, used only by NIST curves Quill's one ciphersuite never uses; client-only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list also covers licences expected in later phases.
unused-allowed-license = "allow"
allow = [
  # The project licence; activitypub_federation (Phase 5) is AGPL too.
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Workspace crates are not published; their own licence is set at the root.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true
deny = [
  # OpenSSL bindings: we use rustls and pure-Rust or aws-lc-rs crypto only.
  { name = "openssl" },
  { name = "openssl-sys" },
  # Marvin timing attack (RUSTSEC-2023-0071); HTTP signatures will use
  # aws-lc-rs instead.
  { name = "rsa" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
