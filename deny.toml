# cargo-deny policy. Run with `cargo deny check`.
# Per-crate bans for the server live in scripts/check-server-deps.sh.

[graph]
all-features = true

[advisories]
# RustSec advisory database. Any unignored advisory fails CI; an ignore entry
# must say why the advisory is unreachable or acceptable.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The list also covers licences expected in later phases.
unused-allowed-license = "allow"
allow = [
  # The project licence; activitypub_federation (Phase 3) is AGPL too.
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Workspace crates are not published; their own licence is set at the root.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true
deny = [
  # OpenSSL bindings: we use rustls and pure-Rust or aws-lc-rs crypto only.
  { name = "openssl" },
  { name = "openssl-sys" },
  # Marvin timing attack (RUSTSEC-2023-0071); HTTP signatures will use
  # aws-lc-rs instead.
  { name = "rsa" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
