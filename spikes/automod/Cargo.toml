# The automated moderation spike (#43): throwaway, outside the main workspace
# on purpose, so the candidate engines stay out of the project's lockfile, CI
# and `cargo vet` until the decision is made. See FINDINGS.md.
[workspace]

[package]
name = "quill-automod-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# One feature per engine, so `scripts/measure-size` can build each alone and
# compare binary sizes against a build with none.
[features]
default = ["rhai", "luau", "starlark", "js", "rules"]
rhai = ["dep:rhai"]
luau = ["dep:mlua"]
starlark = ["dep:starlark", "dep:anyhow"]
js = ["dep:rquickjs"]
rules = ["dep:toml"]

[dependencies]
# The engine-independent `text` API.
regex = "1"
aho-corasick = "1"
unicode-normalization = "0.1"
unicode-security = "0.1"
unicode-segmentation = "1"
linkify = "0.11"
url = "2"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Candidate engines.
rhai = { version = "1.27", optional = true, features = ["serde", "sync"] }
mlua = { version = "0.12", optional = true, features = ["luau", "vendored", "serde"] }
starlark = { version = "0.14", optional = true }
anyhow = { version = "1", optional = true }
rquickjs = { version = "0.14", optional = true }
toml = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
