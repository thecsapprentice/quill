# Links are only allowed to these sites.
[[rule]]
name = "Outside links"
links_except = ["quill.example", "archiveofourown.org"]
then = "reject"
message = "Links to outside sites aren't allowed in prompts."

# Phone numbers: a digit, six or more digits, spaces, dots, dashes or
# brackets, then a digit. Single quotes keep the backslashes as written.
[[rule]]
name = "Phone numbers"
pattern = '\+?\(?\d[\d\s().-]{6,}\d'
then = "reject"
message = "Please don't share phone numbers in prompts."
