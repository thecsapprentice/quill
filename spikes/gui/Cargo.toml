# The 3a spike: throwaway, outside the main workspace on purpose, so the
# desktop webview stack stays out of the project's lockfile, CI and
# `cargo vet` until 3b decides what to adopt. See FINDINGS.md.
[workspace]

[package]
name = "quill-gui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default = []
desktop = ["dioxus/desktop", "dep:tokio", "dep:webkit2gtk"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "=0.7.10" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["time"], optional = true }

# Linux only: WebKitGTK leaves spellcheck off unless asked (see FINDINGS).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.1", optional = true }

[profile.release]
opt-level = "z"
lto = true
