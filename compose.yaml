# Local development and testing only: a Quill server and its database.
#
#   docker compose up --build -d                         # start; board at http://localhost:8080/
#   docker compose exec server quill-server make-admin NAME
#   docker compose --profile demo run --rm seed          # fill an empty database with demo data
#   docker compose logs -f server
#   docker compose down                                  # stop (add -v to delete the database)
#
# Not a production setup. The board is served over plain HTTP, which browsers
# only accept for its Secure session cookie on localhost. In production, put
# it behind HTTPS and set a real database password.

name: quill

services:
  db:
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: quill
      POSTGRES_PASSWORD: ${QUILL_DB_PASSWORD:-quill-local-dev}
      POSTGRES_DB: quill
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quill -d quill"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: .
      target: server
    image: quill-server:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUILL_DATABASE_URL: postgres://quill:${QUILL_DB_PASSWORD:-quill-local-dev}@db/quill
      QUILL_DOMAIN: ${QUILL_DOMAIN:-localhost}
      QUILL_REGISTRATION_OPEN: ${QUILL_REGISTRATION_OPEN:-true}
      QUILL_TAG_POLICY: ${QUILL_TAG_POLICY:-both}
    ports:
      # Bound to this machine only; change QUILL_PORT if 8080 is taken.
      - "127.0.0.1:${QUILL_PORT:-8080}:8080"
    restart: unless-stopped

  # Demo data, only when asked for: `docker compose --profile demo run --rm seed`.
  # Add options after `seed`, e.g. `--prompts 300 --seed 7`; `--help` lists them.
  seed:
    profiles: [demo]
    build:
      context: .
      target: seed
    image: quill-seed:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUILL_DATABASE_URL: postgres://quill:${QUILL_DB_PASSWORD:-quill-local-dev}@db/quill
      QUILL_TAG_POLICY: ${QUILL_TAG_POLICY:-both}

volumes:
  db-data:
