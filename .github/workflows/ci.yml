name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to full commit SHAs.
jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: tests (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quill
          POSTGRES_PASSWORD: quill
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quill"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUILL_TEST_DATABASE_URL: postgres://quill:quill@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test --workspace
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        # Failing tests are also reported as annotations, readable without
        # downloading the log.
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee test.log || {
            grep -E -A3 "panicked at|^test .* FAILED|^---- " test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # The client's keychain code differs per platform; build it and run the
  # store's tests on each (no Postgres needed).
  client-platforms:
    name: client on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo clippy -p quill-core -p quill
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo clippy --locked -p quill-core -p quill --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            grep -E -A6 "^(error|warning)" clippy.log | head -60 | tr '\n' ' ' | sed 's/^/::error::/'
            echo
            exit 1
          }
      - name: cargo test -p quill-core
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        # Failing tests are also reported as annotations, readable without
        # downloading the log.
        run: |
          set -o pipefail
          cargo test --locked -p quill-core 2>&1 | tee test.log || {
            grep -E "panicked at|^test .* FAILED|^---- " test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Server must not link any MLS / HPKE / client crate
        run: ./scripts/check-server-deps.sh
      - name: Install audit tools
        run: cargo install --locked cargo-deny cargo-audit cargo-vet
      - name: cargo deny (advisories, licences, bans, sources)
        run: cargo deny --locked check
      - name: cargo audit (RustSec)
        run: cargo audit --deny warnings
      - name: cargo vet (reviewed dependencies)
        run: cargo vet --locked
