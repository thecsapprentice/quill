[package]
name = "quill-server"
description = "Quill server: prompt board, MLS delivery service and ActivityPub federation. Never holds session keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quill-server"
path = "src/main.rs"

# INVARIANT: no MLS, HPKE or client-crypto crate may appear in this crate's
# dependency tree. `scripts/check-server-deps.sh` enforces this in CI.
[dependencies]
quill-certs.workspace = true
quill-proto.workspace = true
quill-mls-envelope.workspace = true
quill-board-ui.workspace = true

ammonia.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["macros"] }
base64.workspace = true
getrandom.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
